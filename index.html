<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Versenyautó 3D</title>
<style>
:root{--bg:#10131a;--hud:rgba(10,12,18,.65);--fg:#fff;--accent:#ffb020;box-sizing:border-box}
:root[data-theme="light"]{--bg:#cfe6ff}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#cfe6ff}}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--fg);touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.box{background:var(--hud);border-radius:12px;padding:6px 12px;font-size:13px;line-height:1.35;color:#fff}
.box b{font-size:20px;color:var(--accent)}
#ctl{position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;justify-content:space-between;pointer-events:none}
.grp{display:flex;gap:10px;pointer-events:auto}
.btn{width:72px;height:72px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(10,12,18,.55);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;touch-action:none}
.btn.on{background:var(--accent);color:#000}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;font-size:15px;color:#fff;text-shadow:0 2px 6px #000;padding:20px}
#rot{display:none;position:fixed;inset:0;z-index:10;background:#10131a;color:#fff;align-items:center;justify-content:center;flex-direction:column;text-align:center;font-size:18px;gap:12px}
#rot span{font-size:56px;display:inline-block;animation:rr 1.6s ease-in-out infinite}
@keyframes rr{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:700px){#rot{display:flex}}
@media (max-height:500px){.btn{width:64px;height:64px;font-size:24px}.box{font-size:12px;padding:4px 10px}.box b{font-size:17px}#ctl{padding:0 calc(env(safe-area-inset-right,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 8px) calc(env(safe-area-inset-left,0px) + 14px)}#hud{left:calc(env(safe-area-inset-left,0px) + 8px);right:calc(env(safe-area-inset-right,0px) + 8px)}}
#dbar{height:6px;width:90px;margin:3px 0 0 auto;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden}
#dfill{display:block;height:100%;width:0;background:hsl(120,70%,45%)}
#mm{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 8px);width:96px;height:96px;background:rgba(10,12,18,.6);border:2px solid rgba(255,255,255,.4);border-radius:20px;box-sizing:border-box;pointer-events:none}
@media (max-height:500px){#mm{width:80px;height:80px}}
#snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 66px);left:8px;width:36px;height:36px;border-radius:50%;background:rgba(10,12,18,.6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;touch-action:none}
#hint{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);background:rgba(224,32,32,.88);color:#fff;font-weight:700;padding:6px 14px;border-radius:14px;font-size:14px;display:none;pointer-events:none;white-space:nowrap}
#fx{position:fixed;top:28%;left:0;right:0;text-align:center;font-size:26px;font-weight:700;color:#4dff88;text-shadow:0 2px 8px #000;opacity:0;transition:opacity .3s;pointer-events:none}
</style>
</head>
<body>
<div id="hud">
  <div class="box">Kör <b id="lap">1</b>/10<br>Idő <span id="t">0.00</span> s · Hely <b id="pos">6</b>/6</div>
  <div class="box" style="text-align:right"><b id="spd">0</b> km/h<br>Legjobb: <span id="best">–</span><br>Sérülés <span id="dmg">0</span>%<div id="dbar"><i id="dfill"></i></div></div>
</div>
<div id="msg">Nyomd a gázt az indításhoz!<br><small>Nyilak / WASD vagy érintőgombok</small></div>
<canvas id="mm" width="220" height="220"></canvas>
<div id="snd">🔊</div>
<div id="hint">🅿️ Parkold le a kocsit a leállónál – piros hely</div>
<div id="fx"></div>
<div id="ctl">
  <div class="grp"><div class="btn" data-k="left">◀</div><div class="btn" data-k="right">▶</div></div>
  <div class="grp"><div class="btn" data-k="brake">■</div><div class="btn" data-k="gas">▲</div></div>
</div>
<div id="rot"><span>📱</span>Fordítsd el a telefont<br>fekvő módba a játékhoz!</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8ec8ff);
scene.fog=new THREE.Fog(0x8ec8ff,120,650);
const cam=new THREE.PerspectiveCamera(70,1,.1,1100);
const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.insertBefore(R.domElement,document.body.firstChild);
function rs(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();

scene.add(new THREE.HemisphereLight(0xffffff,0x3a5a2a,.9));
const sun=new THREE.DirectionalLight(0xffffff,.7);sun.position.set(80,150,50);scene.add(sun);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(3200,3200),new THREE.MeshLambertMaterial({color:0x3f8f3a}));
ground.rotation.x=-Math.PI/2;scene.add(ground);

// Pálya
const pts=[];
for(let i=0;i<12;i++){const a=i/12*Math.PI*2;const r=210+60*Math.sin(2*a)+30*Math.cos(3*a);pts.push(new THREE.Vector3(Math.cos(a)*r*1.5,0,Math.sin(a)*r));}
const curve=new THREE.CatmullRomCurve3(pts,true);
const N=700,HW=10;
const S=curve.getSpacedPoints(N);S.pop();
const NN=S.length;
const PL=200,RAMP=50,PC=32;
const HH=S.map((p,i)=>{const q=S[(i+1)%NN];return Math.atan2(q.x-p.x,q.z-p.z)});
let PS=0,bestT=1e9;
for(let s=Math.round(NN*.2);s<NN*.75-PL;s++){let tt=0;for(let j=0;j<PL;j++){let d=HH[(s+j+1)%NN]-HH[(s+j)%NN];d=Math.atan2(Math.sin(d),Math.cos(d));tt+=Math.abs(d)}if(tt<bestT){bestT=tt;PS=s}}
const PG=(PS+PL/2)%NN;
function pitJ(i){return((i-PS)%NN+NN)%NN}
function pitK(i){const j=pitJ(i);if(j>PL)return 0;const u=Math.min(1,Math.min(j,PL-j)/RAMP);return u*u*(3-2*u)}
function pitOut(k){return HW+PC*k}
function wallR(i){return Math.max(WD,pitOut(pitK(i))+2)}
const pos=[],idx=[];
for(let i=0;i<NN;i++){
  const p=S[i],q=S[(i+1)%NN];
  const t=new THREE.Vector3().subVectors(q,p).normalize();
  const lx=t.z,lz=-t.x;
  pos.push(p.x+lx*HW,.03,p.z+lz*HW,p.x-lx*HW,.03,p.z-lz*HW);
  const a=i*2,b=((i+1)%NN)*2;
  idx.push(a,a+1,b,b,a+1,b+1);
}
const rg=new THREE.BufferGeometry();
rg.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
rg.setIndex(idx);rg.computeVertexNormals();
scene.add(new THREE.Mesh(rg,new THREE.MeshLambertMaterial({color:0x444850,side:THREE.DoubleSide})));
// Szegélyek (váltakozó piros-fehér)
const curbMat=[new THREE.MeshBasicMaterial({color:0xdd2222}),new THREE.MeshBasicMaterial({color:0xffffff})];
const cg=new THREE.BoxGeometry(1,.15,3.2);
for(let i=0;i<NN;i+=4){
  const p=S[i],q=S[(i+1)%NN];
  const t=new THREE.Vector3().subVectors(q,p).normalize();
  const ang=Math.atan2(t.x,t.z);
  [1,-1].forEach(s=>{
    if(s===-1&&pitK(i)>.02&&pitK(i)<.7)return;const m=new THREE.Mesh(cg,curbMat[(i/4)%2]);
    m.position.set(p.x+t.z*(HW+.5)*s,.08,p.z-t.x*(HW+.5)*s);m.rotation.y=ang;scene.add(m);
  });
}
// Fal (F1 stílusú, kb. az autó magasságának fele)
const WD=HW+7,WH=.9;
{const pp=[],pi=[],ids=[];
for(let j=0;j<=PL;j++)ids.push((PS+j)%NN);
ids.forEach((i,j)=>{const p=S[i],q=S[(i+1)%NN],t=new THREE.Vector3().subVectors(q,p).normalize();
  {const k=pitK(i),a1=HW-PC*k,a2=-pitOut(k);pp.push(p.x+t.z*a1,.045,p.z-t.x*a1,p.x+t.z*a2,.045,p.z-t.x*a2);}
  if(j<ids.length-1){const a=j*2;pi.push(a,a+1,a+2,a+2,a+1,a+3)}});
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.Float32BufferAttribute(pp,3));pg.setIndex(pi);pg.computeVertexNormals();
scene.add(new THREE.Mesh(pg,new THREE.MeshLambertMaterial({color:0x444850,side:THREE.DoubleSide})));
const p=S[PG],q=S[(PG+1)%NN],t=new THREE.Vector3().subVectors(q,p).normalize();
const gr2=new THREE.Group();gr2.position.set(p.x,0,p.z);gr2.rotation.y=Math.atan2(t.x,t.z);
const gl=new THREE.Mesh(new THREE.PlaneGeometry(19,1.6),new THREE.MeshBasicMaterial({color:0x00e060}));gl.rotation.x=-Math.PI/2;gl.position.set(-32,.08,0);gr2.add(gl);
const cv=document.createElement('canvas');cv.width=256;cv.height=64;const cx=cv.getContext('2d');cx.fillStyle='#0a8f4a';cx.fillRect(0,0,256,64);cx.fillStyle='#fff';cx.font='bold 44px sans-serif';cx.textAlign='center';cx.fillText('BOX',128,48);
const sg=new THREE.Mesh(new THREE.PlaneGeometry(8,2),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv),side:THREE.DoubleSide}));sg.position.set(-32,7.6,0);gr2.add(sg);
const pm2=new THREE.MeshLambertMaterial({color:0x333840});
[-22,-42].forEach(x=>{const m=new THREE.Mesh(new THREE.BoxGeometry(.3,8,.3),pm2);m.position.set(x,4,0);gr2.add(m)});
scene.add(gr2);
{const fp=S[PS],fq=S[(PS+1)%NN],ft=new THREE.Vector3().subVectors(fq,fp).normalize();
const g3=new THREE.Group();g3.position.set(fp.x,0,fp.z);g3.rotation.y=Math.atan2(ft.x,ft.z);
const mk=(txt,bg,x)=>{const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d');g.fillStyle=bg;g.fillRect(0,0,256,64);g.fillStyle='#fff';g.font='bold 40px sans-serif';g.textAlign='center';g.fillText(txt,128,46);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(8,2),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),side:THREE.DoubleSide}));m.position.set(x,8.2,0);g3.add(m)};
mk('PÁLYA ↑','#1b4fa8',5.2);mk('BOX ↗','#0a8f4a',-5.2);
const fm=new THREE.MeshLambertMaterial({color:0x333840});
[12,-12].forEach(x=>{const m=new THREE.Mesh(new THREE.BoxGeometry(.4,10,.4),fm);m.position.set(x,5,0);g3.add(m)});
const bm2=new THREE.Mesh(new THREE.BoxGeometry(24.4,.5,.5),fm);bm2.position.set(0,9.5,0);g3.add(bm2);
scene.add(g3);}
}
const walls=new THREE.InstancedMesh(new THREE.BoxGeometry(.8,WH,3.8),new THREE.MeshLambertMaterial({color:0xffffff}),NN*2);
walls.frustumCulled=false;
{const dm=new THREE.Object3D(),cR=new THREE.Color(0xd02020),cW=new THREE.Color(0xf2f2f2);
let wi=0;
for(let i=0;i<NN;i++){
  const p=S[i],q=S[(i+1)%NN];
  const t=new THREE.Vector3().subVectors(q,p).normalize();
  const ang=Math.atan2(t.x,t.z);
  [1,-1].forEach(s=>{
    const w=s>0?WD:wallR(i);dm.position.set(p.x+t.z*w*s,WH/2,p.z-t.x*w*s);dm.rotation.y=ang;dm.updateMatrix();
    walls.setMatrixAt(wi,dm.matrix);walls.setColorAt(wi,Math.floor(i/6)%2?cR:cW);wi++;
  });
}
walls.instanceMatrix.needsUpdate=true;walls.instanceColor.needsUpdate=true;}
scene.add(walls);
// Elválasztó fal a levágázásnál (a fües területen)
{const idxs=[];for(let i=0;i<NN;i++)if(pitK(i)>.625)idxs.push(i);
const dv=new THREE.InstancedMesh(new THREE.BoxGeometry(.8,WH,3.8),new THREE.MeshLambertMaterial({color:0xffffff}),idxs.length);dv.frustumCulled=false;
const dm=new THREE.Object3D(),cR=new THREE.Color(0xd02020),cW=new THREE.Color(0xf2f2f2);
idxs.forEach((i,n)=>{const p=S[i],q=S[(i+1)%NN],t=new THREE.Vector3().subVectors(q,p).normalize(),w=-PC*pitK(i)/2;
  dm.position.set(p.x+t.z*w,WH/2,p.z-t.x*w);dm.rotation.y=Math.atan2(t.x,t.z);dm.updateMatrix();dv.setMatrixAt(n,dm.matrix);dv.setColorAt(n,Math.floor(i/6)%2?cR:cW)});
dv.instanceMatrix.needsUpdate=true;dv.instanceColor.needsUpdate=true;scene.add(dv);}
// Rajtvonal
const sl=new THREE.Mesh(new THREE.PlaneGeometry(HW*2,2),new THREE.MeshBasicMaterial({color:0xffffff}));
sl.rotation.x=-Math.PI/2;sl.position.set(S[0].x,.05,S[0].z);
sl.rotation.z=-Math.atan2(S[1].x-S[0].x,S[1].z-S[0].z)+Math.PI/2*0;
{const t=new THREE.Vector3().subVectors(S[1],S[0]).normalize();sl.rotation.set(-Math.PI/2,0,0);sl.rotation.order='YXZ';sl.rotation.y=Math.atan2(t.x,t.z);}
function mkChk(c,r){const cv=document.createElement('canvas');cv.width=c*16;cv.height=r*16;const g=cv.getContext('2d');for(let y=0;y<r;y++)for(let x=0;x<c;x++){g.fillStyle=(x+y)%2?'#111':'#fff';g.fillRect(x*16,y*16,16,16)}const tx=new THREE.CanvasTexture(cv);tx.magFilter=THREE.NearestFilter;return tx}
sl.material=new THREE.MeshBasicMaterial({map:mkChk(20,2)});
scene.add(sl);
{const t=new THREE.Vector3().subVectors(S[1],S[0]).normalize();
const gr=new THREE.Group();gr.position.set(S[0].x,0,S[0].z);gr.rotation.y=Math.atan2(t.x,t.z);
const gw=HW+1.5,pm=new THREE.MeshLambertMaterial({color:0x333840});
[-1,1].forEach(s=>{
  const p=new THREE.Mesh(new THREE.BoxGeometry(.8,12,.8),pm);p.position.set(s*gw,6,0);gr.add(p);
  const pl=new THREE.Mesh(new THREE.BoxGeometry(.15,3.5,.15),pm);pl.position.set(s*gw,13.7,0);gr.add(pl);
  const fl=new THREE.Mesh(new THREE.PlaneGeometry(3.6,2.3),new THREE.MeshBasicMaterial({map:mkChk(6,4),side:THREE.DoubleSide}));
  fl.position.set(s*(gw+1.9),14.6,0);gr.add(fl);
});
const bm=new THREE.Mesh(new THREE.BoxGeometry(gw*2+.8,.8,.8),pm);bm.position.set(0,12,0);gr.add(bm);
const bn=new THREE.Mesh(new THREE.PlaneGeometry(gw*2,3),new THREE.MeshBasicMaterial({map:mkChk(30,3),side:THREE.DoubleSide}));
bn.position.set(0,10.1,0);gr.add(bn);
scene.add(gr);}

// Fák
const tg=new THREE.CylinderGeometry(.5,.7,3,6),lg=new THREE.ConeGeometry(3,8,7);
const tm=new THREE.MeshLambertMaterial({color:0x6b4a2b}),lm=new THREE.MeshLambertMaterial({color:0x1f6b2a});
function nearest(x,z){let b=1e9,bi=0;for(let i=0;i<NN;i++){const dx=S[i].x-x,dz=S[i].z-z,d=dx*dx+dz*dz;if(d<b){b=d;bi=i}}return[bi,Math.sqrt(b)]}
const trees=[];let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
for(let i=0;i<280;i++){
  const x=(rnd()-.5)*1200,z=(rnd()-.5)*950;
  const nt=nearest(x,z);if(nt[1]<28||(pitK(nt[0])>0&&nt[1]<58))continue;
  const g=new THREE.Group();
  const a=new THREE.Mesh(tg,tm);a.position.y=1.5;
  const b=new THREE.Mesh(lg,lm);b.position.y=7;
  g.add(a,b);g.position.set(x,0,z);const sc=.8+rnd()*.7;g.scale.set(sc,sc,sc);scene.add(g);trees.push(g);
}

// Autó
const car=new THREE.Group();
const body=new THREE.Mesh(new THREE.BoxGeometry(2.2,.7,4.6),new THREE.MeshLambertMaterial({color:0xe02020}));body.position.y=.8;
const cab=new THREE.Mesh(new THREE.BoxGeometry(1.8,.6,2),new THREE.MeshLambertMaterial({color:0x222a33}));cab.position.set(0,1.4,-.2);
const spoil=new THREE.Mesh(new THREE.BoxGeometry(2.2,.1,.6),new THREE.MeshLambertMaterial({color:0x111111}));spoil.position.set(0,1.45,-2.2);
car.add(body,cab,spoil);
const wg=new THREE.CylinderGeometry(.45,.45,.4,14),wm=new THREE.MeshLambertMaterial({color:0x111111});
[[-1.15,1.4],[1.15,1.4],[-1.15,-1.4],[1.15,-1.4]].forEach(([x,z])=>{const w=new THREE.Mesh(wg,wm);w.rotation.z=Math.PI/2;w.position.set(x,.45,z);car.add(w)});
car.rotation.order='YXZ';scene.add(car);

// Rámpák (véletlen helyen, az egyenesebb szakaszokon)
const RW=7,RL=12,RH=2.2,ramps=[];
{const shp=new THREE.Shape();shp.moveTo(-RL/2,0);shp.lineTo(RL/2,0);shp.lineTo(RL/2,RH);shp.lineTo(-RL/2,0);
const rg2=new THREE.ExtrudeGeometry(shp,{depth:RW,bevelEnabled:false});rg2.translate(0,0,-RW/2);rg2.rotateY(-Math.PI/2);
const rmat=new THREE.MeshLambertMaterial({color:0xffa31a});
let guard=0;
while(ramps.length<0&&guard++<800){
  const i=Math.floor(Math.random()*NN);
  if(i>NN-80||i<60)continue;
  if(i>PS-60&&i<PS+PL+60)continue;
  if(ramps.some(r=>Math.abs(r.i-i)<70))continue;
  let tt=0;for(let j=0;j<24;j++){let d=HH[(i+j+1)%NN]-HH[(i+j)%NN];d=Math.atan2(Math.sin(d),Math.cos(d));tt+=Math.abs(d)}
  if(tt>.16)continue;
  const p=S[i],q=S[(i+1)%NN],tx=q.x-p.x,tz=q.z-p.z,l=Math.hypot(tx,tz),lat=(Math.random()-.5)*8;
  const h=Math.atan2(tx,tz),x=p.x+tz/l*lat,z=p.z-tx/l*lat;
  const m=new THREE.Mesh(rg2,rmat);m.position.set(x,0,z);m.rotation.y=h;scene.add(m);
  ramps.push({i,x,z,sh:Math.sin(h),ch:Math.cos(h)});
}}
function gndAt(x,z,h){let g=0;const sh=Math.sin(h),ch=Math.cos(h);
  for(const r of ramps){const dx=x-r.x,dz=z-r.z,lz=dx*r.sh+dz*r.ch,ls=dx*r.ch-dz*r.sh;
    if(Math.abs(ls)<RW/2+.6&&Math.abs(lz)<RL/2&&(sh*r.sh+ch*r.ch)>.3){const y=RH*(lz+RL/2)/RL;if(y>g)g=y}}
  return g}
function phys(o,x,z,h,v,dt){const g=gndAt(x,z,h);
  if(!o.air){if(o.y-g>.05){o.air=true;o.vy=Math.max(0,Math.abs(v)*RH/RL*.95)}else o.y=g}
  if(o.air){o.vy-=45*dt;o.y+=o.vy*dt;if(o.y<=g){const imp=-o.vy;o.y=g;o.air=false;o.vy=0;return imp}}
  return 0}
// Botok
const bG=new THREE.BoxGeometry(2.2,.7,4.6),cG=new THREE.BoxGeometry(1.8,.6,2),sG=new THREE.BoxGeometry(2.2,.1,.6);
const cabM=new THREE.MeshLambertMaterial({color:0x222a33}),spM=new THREE.MeshLambertMaterial({color:0x111111});
function mkCar(color){const g=new THREE.Group();g.rotation.order='YXZ';
  const b=new THREE.Mesh(bG,new THREE.MeshLambertMaterial({color}));b.position.y=.8;
  const c=new THREE.Mesh(cG,cabM);c.position.set(0,1.4,-.2);
  const s=new THREE.Mesh(sG,spM);s.position.set(0,1.45,-2.2);
  g.add(b,c,s);
  [[-1.15,1.4],[1.15,1.4],[-1.15,-1.4],[1.15,-1.4]].forEach(([x,z])=>{const w=new THREE.Mesh(wg,wm);w.rotation.z=Math.PI/2;w.position.set(x,.45,z);g.add(w)});
  return g}
const segLen=curve.getLength()/N;
const vmax=[];
for(let i=0;i<NN;i++){const a=S[i],b=S[(i+6)%NN],c=S[(i+12)%NN];
  const h1=Math.atan2(b.x-a.x,b.z-a.z),h2=Math.atan2(c.x-b.x,c.z-b.z);
  const d=Math.abs(Math.atan2(Math.sin(h2-h1),Math.cos(h2-h1)));
